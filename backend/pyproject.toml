[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    # SQLAlchemy's async engine requires greenlet, but its transitive marker
    # omits macOS arm64 (lists Linux 'aarch64' only), so it is not installed on
    # Apple Silicon. Declare it directly, unconditionally, to keep it portable.
    "greenlet>=3.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]
