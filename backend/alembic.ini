# Alembic configuration for the Fiji IT Service Desk backend.
#
# The database URL is NOT stored here. env.py reads DATABASE_URL from the
# environment (same source as the application), so this file carries no
# secrets and no environment-specific paths.
[alembic]
script_location = migrations
prepend_sys_path = .
# Use path-style separators for version file slugs.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
